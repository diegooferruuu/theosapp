# Nginx: /api → backend (NestJS), resto → frontend (Next.js)

upstream theo_backend {
    server backend:3001;
}

upstream theo_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://theo_backend;
        proxy_read_timeout 60s;
    }

    # El service worker nunca debe quedar cacheado.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        proxy_pass http://theo_frontend;
    }

    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://theo_frontend;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://theo_frontend;
    }
}
