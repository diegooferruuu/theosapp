# Theo’s App — stack completo
#   ./scripts/init-env.sh   (o cp .env.example .env y editar)
#   docker compose up -d --build
name: theosapp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-theo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-theosapp}
      TZ: ${TZ:-America/La_Paz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-theo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-theosapp}?schema=public
      PORT: 3001
      TZ: ${TZ:-America/La_Paz}
      APP_URL: ${APP_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-diego}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Diego}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Define SUPERADMIN_PASSWORD en .env}
      DEFAULT_PETS: ${DEFAULT_PETS:-Theo}
      DAILY_ALERT_HOUR: ${DAILY_ALERT_HOUR:-9}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-true}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    # Alias únicos: si nginx se une a la red de otro proyecto (p. ej. para que
    # otro proxy lo sirva por HTTPS), nombres genéricos como "backend" podrían
    # resolver a contenedores ajenos.
    networks:
      default:
        aliases: [theosapp-backend]

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://theosapp-backend:3001
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      default:
        aliases: [theosapp-frontend]

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
