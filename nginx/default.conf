# Nginx: /api → backend (NestJS), resto → frontend (Next.js)

upstream theo_backend {
    server theosapp-backend:3001;
}

upstream theo_frontend {
    server theosapp-frontend:3000;
}

# Si llega a través de otro proxy (p. ej. Caddy con HTTPS), se respeta su protocolo.
map $http_x_forwarded_proto $theo_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # IP real del cliente cuando la petición viene de un proxy en la red privada de Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $theo_forwarded_proto;
    proxy_hide_header X-Powered-By;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://theo_backend;
        proxy_read_timeout 60s;
    }

    # El service worker nunca debe quedar cacheado.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        proxy_pass http://theo_frontend;
    }

    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://theo_frontend;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://theo_frontend;
    }
}
